name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - instalar e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Rodar testes do backend
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend - instalar e buildar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm install

      - name: Buildar o frontend
        working-directory: frontend
        run: npm run build
